[package]
name = "bidi-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Raul Tovar <raultov@protonmail.com>"]
description = "A lightweight, asynchronous, and low-overhead Rust client for WebDriver BiDi (plus a minimal Firefox RDP debugger), focused on Firefox."
readme = "README.md"
repository = "https://github.com/raultov/bidi-lite"
license = "MIT"
keywords = ["webdriver", "bidi", "firefox", "automation", "debugger"]
categories = ["asynchronous", "development-tools::debugging", "web-programming"]
exclude = [".gitignore", "examples/*", "docs/*", "tests/*", "Makefile", "dupes.toml", "AGENTS.md"]

[lints.rust]
# No-unsafe policy (AGENTS.md). `deny` rather than `forbid`, as in knot-lite:
# an audited exception would need `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these lints are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Library hygiene: a panic in a library is a bug the caller cannot handle.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tracing = "0.1.44"
oneshot = "0.1.11"

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
